name: Fuzz smoke

# M03-1 / #5359 — #3141 1단계 스모크 배선.
# 기존 cargo-fuzz 타깃 6개(parse_hwp / parse_hwp3 / parse_hwpx / parse_hml /
# parse_wmf / parse_ooxml_chart)를 각 60초 돌리고, 크래시·타임아웃·OOM 산출물을
# 실패 시 아티팩트로 올린다.
#
# PR required check 가 아니다. pull_request 트리거를 두지 않는다.
# DoS 수정은 M03-3 이후. OSS-Fuzz 등재는 M10. 왕복 정합성은 M04.

on:
  schedule:
    # 다른 nightly(cache-generation-sweep 18:23, CodeQL 월 06:00)와 시각을 겹치지 않게 한다.
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: 타깃당 libFuzzer 실행 초 (nightly 기본 60)
        required: false
        default: "60"

permissions:
  contents: read

concurrency:
  group: fuzz-smoke
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-smoke:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    # 컴파일(sanitizer) + 60초 런. hang 상한이지 성능 목표가 아니다.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - parse_hwp
          - parse_hwp3
          - parse_hwpx
          - parse_hml
          - parse_wmf
          - parse_ooxml_chart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          toolchain: nightly

      # cargo-fuzz 빌드 캐시는 저장하지 않는다.
      #
      # fuzz/Cargo.lock 은 .gitignore 대상이라 저장소에 없고 cargo-fuzz 가 실행마다
      # 새로 만든다. 그 내용이 조금씩 달라져 key 의 lock 해시가 매 실행 바뀌므로 이
      # 캐시는 한 번도 restore 되지 않는다. 실측(2026-10-18) 최근 3개 run 은 6개 타깃
      # 전부 `No cache found.` 였다. 6개 타깃 × 약 320MB = 하루 약 1.9GiB 가 저장만
      # 되고, fuzz-smoke 캐시 30개 9.26GiB 가 Actions cache 한도 10GB 를 밀어 올려
      # cache-generation-sweep 이 103.5% 로 실패했다.
      #
      # #4080 이후의 세대 상한으로도 회수되지 않는다. rust-cache 는 shared-key 와 잡
      # 사이에 해시 조각이 하나 더 있는 key 를 쓴다
      # (`v0-rust-<shared-key>-<os>-<arch>-<lock앞8>-<env앞8>`). sweep 의 groupOf 는
      # 후행 해시 **하나만** 떼므로 최상위 key 마다 그룹이 갈리고, 최신 2세대를 남기는
      # 규칙이 매일 새 그룹을 그대로 살린다. 스텝을 아예 두지 않는 것이 유일한 차단
      # 지점이다. 빌드 캐시가 없어 수 분 느려지지만 restore 성공 0건과 같은 값이다.

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Smoke-run ${{ matrix.target }} (60s)
        env:
          TARGET: ${{ matrix.target }}
          MAX_TOTAL_TIME: ${{ github.event_name == 'workflow_dispatch' && inputs.max_total_time || '60' }}
        run: |
          set -euo pipefail
          cargo +nightly fuzz run "${TARGET}" -- \
            -max_total_time="${MAX_TOTAL_TIME}" \
            -rss_limit_mb=2048 \
            -timeout=30 \
            -print_final_stats=1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.run_id }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 14
